<!DOCTYPE html>
<html lang="en">
<head>

        .card { background: #111827; padding: 35px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); width: 100%; max-width: 450px; border: 1px solid #1f2937; }
        h2 { color: #38bdf8; margin-top: 0; font-size: 24px; text-align: center; }

        .price-tag { font-size: 32px; font-weight: bold; color: #22c55e; }
        .pay-box { background: #0b0f19; padding: 18px; border-radius: 10px; margin: 15px 0; border: 1px solid #374151; }
        .pay-option { font-size: 14px; color: #cbd5e1; }
        .upi-code { background: #1e293b; padding: 6px 10px; border-radius: 6px; color: #38bdf8; font-family: monospace; display: inline-block; margin-top: 4px; border: 1px solid #475569; }
        .btn-link { display: block; background: #2563eb; color: #fff; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 10px; transition: background 0.2s; }
        .btn-link:hover { background: #1d4ed8; }
        .btn-activate { background: #22c55e; color: #fff; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 15px; }
        .btn-activate:hover { background: #16a34a; }
