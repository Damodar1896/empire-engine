name: Autopilot Empire 24/7 Engine

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-empire-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pydantic cryptography

      - name: Execute Autonomous Empire Batch
        run: |
          python3 empire_core.py
        env:
          DB_PATH: "empire_cloud_sync.db"
